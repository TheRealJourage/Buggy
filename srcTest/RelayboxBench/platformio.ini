; Bench test for the relay box controller (Nucleo-F446RE + CN7 plug-on board + CN10 relay bundles).
; Upload: copy .pio/build/bench/firmware.bin onto the NUCLEO drive (upload_protocol = mbed) or `pio run -t upload`.
; Test procedure: TESTPLAN.md
[env:bench]
platform        = ststm32@20.0.0   ; built and checked on core with this version (STM32 Arduino core 3.x: class Uart)
board           = nucleo_f446re
framework       = arduino
monitor_speed   = 115200
monitor_echo    = yes
monitor_filters = send_on_enter
upload_protocol = mbed
build_flags     = -D HAL_CAN_MODULE_ENABLED

; Function test for the AYWHP GC9A01 round displays on a Raspberry Pi Pico (RP2040).
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps =
    moononournation/GFX Library for Arduino
monitor_speed = 115200

; Pin continuity check: drives one display line high at a time, the rest low.
[env:pico_pincheck]
extends = env:pico
build_src_filter = -<*> +<../diag/>
lib_deps =

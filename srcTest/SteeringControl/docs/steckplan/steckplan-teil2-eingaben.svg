<svg width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Eingaben am RP2040-Tiny: 7 Taster, 2 Potis, Status-LED" xmlns="http://www.w3.org/2000/svg"><style>svg{  --bg: #e9eeec;  --panel: #fbfcfc;  --ink: #16201c;  --muted: #5d6c66;  --faint: #d5ddda;  --accent: #0f6b62;  --board-uno: #d8ebee;  --board-uno-s: #2f7d8c;  --board-tiny: #dde4f4; --board-tiny-s: #3b5aa3;  --board-psu: #f1e3e1;  --board-psu-s: #9b4a3f;  --chip: #262b2a; --chip-ink: #eef2f1;  --w12: #d1242f; --wg: #2a3531; --w5: #d9730d; --w33: #b3246b;  --wrx: #1d63c7; --wtx: #1b8a3a; --wcs: #7b3fc4; --wlin: #b07d00;  --wsig: #0f7a70; --wbtn: #8a5a14; --wpot: #0e7490;  --led-g: #36b24a; --led-r: #e0413a;  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;  --sans: "Segoe UI", system-ui, sans-serif;}.c12 { --c: var(--w12); } .cg { --c: var(--wg); } .c5 { --c: var(--w5); } .c33 { --c: var(--w33); }
.crx { --c: var(--wrx); } .ctx { --c: var(--wtx); } .ccs { --c: var(--wcs); } .clin { --c: var(--wlin); }
.csig { --c: var(--wsig); } .cbtn { --c: var(--wbtn); } .cpot { --c: var(--wpot); }
.cg.num { color: var(--panel); }
svg text { font-family: var(--mono); fill: var(--ink); }
svg .w { fill: none; stroke: var(--c); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
svg .dot { fill: var(--c); }
svg .badge circle { fill: var(--c); stroke: var(--panel); stroke-width: 2; }
svg .badge text { font-size: 11px; font-weight: 600; fill: #fff; }
svg .badge.cg text, svg .badge.clin text { fill: var(--panel); }
svg .board { stroke-width: 2; }
svg .uno { fill: var(--board-uno); stroke: var(--board-uno-s); }
svg .tiny { fill: var(--board-tiny); stroke: var(--board-tiny-s); }
svg .psu { fill: var(--board-psu); stroke: var(--board-psu-s); }
svg .port { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; }
svg .mcu { fill: var(--chip); }
svg .mcu + text, svg .porttxt { font-size: 10px; fill: var(--muted); }
svg .mcu + text { fill: var(--chip-ink); }
svg .boardname { font-family: var(--sans); font-weight: 700; font-size: 14px; }
svg .boardname.big { font-size: 18px; }
svg .chipname { font-family: var(--sans); font-weight: 700; font-size: 14px; }
svg .chipsub { font-family: var(--sans); font-size: 12px; fill: var(--muted); }
svg .hdr { font-size: 10px; letter-spacing: .08em; fill: var(--muted); }
svg .rail { font-size: 12px; font-weight: 600; fill: var(--muted); }
svg .chip { fill: var(--chip); }
svg .notch { fill: var(--panel); }
svg .pin1 { fill: var(--chip-ink); }
svg .pinname { font-size: 11px; fill: var(--chip-ink); }
svg .lead { stroke: var(--muted); stroke-width: 3; }
svg .pad { fill: var(--panel); stroke: var(--muted); stroke-width: 1.2; }
svg .pad.used { fill: var(--ink); stroke: var(--ink); }
svg .lbl { font-size: 10px; fill: var(--muted); }
svg .lbl.used { fill: var(--ink); font-weight: 600; }
svg .val { font-size: 11px; fill: var(--ink); }
svg .val.strong { font-weight: 600; font-family: var(--sans); font-size: 12px; }
svg .part { fill: var(--panel); stroke: var(--ink); stroke-width: 1.8; }
svg .part.rbody { fill: #e6d3a8; stroke-width: 1.2; }
svg .cut { fill: var(--panel); }
svg .plate { stroke: var(--ink); stroke-width: 2.4; }
svg .dio { fill: var(--ink); }
svg .dio.led-g { fill: var(--led-g); }
svg .dio.led-r { fill: var(--led-r); }
svg .rays { stroke: var(--ink); stroke-width: 1.3; fill: none; }
svg .term { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
svg .term.plus { stroke: var(--w12); stroke-width: 2.5; }
svg .term.minus { stroke: var(--wg); stroke-width: 2.5; }
svg .termtxt { font-size: 11px; font-weight: 600; }
svg .arrowhead { fill: var(--ink); }
svg .ncx { stroke: var(--w12); stroke-width: 2.4; }

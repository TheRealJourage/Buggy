; PlatformIO Project Configuration File
;
; LIN Bus Steering Control System
; - RP2040 Slave (Waveshare RP2040-Tiny) -> slave/
; - Arduino Uno R3 Master               -> master/
;
; Each program lives in its own subdirectory.
; The set_src_dir.py script routes each environment to the correct folder.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rp2040_slave

; ============================================================================
; RP2040 SLAVE (Waveshare RP2040-Tiny)
; Source: slave/steering_wheel_controller.ino
; ============================================================================
[env:rp2040_slave]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

extra_scripts = pre:set_src_dir.py

upload_protocol = picotool

monitor_speed = 115200

; ============================================================================
; ARDUINO UNO R3 MASTER
; Source: master/lin_bus_master.ino
; ============================================================================
[env:uno_master]
platform = atmelavr
board = uno
framework = arduino

extra_scripts = pre:set_src_dir.py

upload_speed = 115200

monitor_speed = 115200

; ============================================================================
; UPLOAD INSTRUCTIONS
; ============================================================================
;
; Upload RP2040 Slave:
;   pio run -e rp2040_slave -t upload
;
; Upload Arduino Uno Master:
;   pio run -e uno_master -t upload
;
; RP2040 not detected? Hold BOOTSEL while plugging in USB.
; Arduino upload fails? Disconnect MCP2003 from pins 0/1 first.

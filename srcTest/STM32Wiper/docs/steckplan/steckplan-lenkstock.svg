svg .lbl.used { fill: var(--ink); font-weight: 600; }
svg .val { font-size: 11px; fill: var(--ink); }
svg .val.strong { font-weight: 600; font-family: var(--sans); font-size: 12px; }
svg .part { fill: var(--panel); stroke: var(--ink); stroke-width: 1.8; }

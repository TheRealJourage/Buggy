svg .mcu + text { fill: var(--chip-ink); }
svg .boardname { font-family: var(--sans); font-weight: 700; font-size: 14px; }
svg .boardname.big { font-size: 18px; }
svg .chipname { font-family: var(--sans); font-weight: 700; font-size: 14px; }
svg .chipsub { font-family: var(--sans); font-size: 12px; fill: var(--muted); }
svg .hdr { font-size: 10px; letter-spacing: .08em; fill: var(--muted); }
